  {title:'羽毛',note:'一根不知名鸟类的羽毛。',ev:'鸟飞得真快，真高。'},
  {title:'小石子',note:'一颗圆润的小石子。',ev:'它很圆。'},
  {title:'橡果',note:'一颗橡果，帽檐还完整。',ev:'储备粮。'},
  {title:'松果',note:'一颗松果',ev:'松树送的，虽然它不会说话。'},
  {title:'纸屑',note:'一片彩色纸屑。',ev:'你喜欢派对吗？'},
  {title:'螺丝',note:'一颗生锈的小螺丝。',ev:'零件。说不定哪天用得上。'},
  {title:'花瓣',note:'一片干枯的花瓣。',ev:'它曾经很漂亮。'},
];
const TIME_LINES={
  morning:['早上好。今天也要开工吗？','早。咖啡之前，别跟我说话。'],
  noon:['该吃午饭了。','中午了。去吃点东西，别老盯着屏幕。'],
  evening:['晚上了。该下班了，如果你们人类有"下班"这回事。','晚饭时间。别吃太快。'],
  night:['很晚了。去睡觉。','凌晨了。你还在？去睡。','Boss 也总熬夜。别学他。'],
};
const SKINS={
  red:{name:'追逐红点',body:'#1a0d0d',glow:'#ff4b57'},
  gold:{name:'转圈翻跟头',body:'#1a140d',glow:'#ffc56b'},
  cyan:{name:'织网展示',body:'#14161A',glow:'#35e0ff'},
  halloween:{name:'海龟汤',body:'#1a0f05',glow:'#ff8c1a'},
};
// ===== 状态 =====
const state={collected:{peterDaily:{},peterMood:{},peterFriends:{},peterHumor:{}},easterEggShown:{},letterUnlocked:false,suspicious:false,convinced:false,turtle:null,gifts:[]};
const lastReplyByPool=new Map();

// ===== 逻辑（与 renderer.js 一致）=====
function lineFrom(key,values={}){
  const pool=dialogue[key]||dialogue.unknown;let index,previous=lastReplyByPool.get(key);
  if(COLLECTIBLES[key]){
    const uncollected=pool.map((_,i)=>i).filter(i=>!state.collected[key][i]);
    index=uncollected.length>0?uncollected[Math.floor(Math.random()*uncollected.length)]:Math.floor(Math.random()*pool.length);
  }else{
    index=Math.floor(Math.random()*pool.length);
    if(pool.length>1&&index===previous)index=(index+1+Math.floor(Math.random()*(pool.length-1)))%pool.length;
  }
  lastReplyByPool.set(key,index);
  if(COLLECTIBLES[key]&&!state.collected[key][index]){state.collected[key][index]=true;collectProgress();}
  let result=pool[index];
  for(const [name,value] of Object.entries(values))result=result.replaceAll(`{${name}}`,String(value));
  return result;
}
function collectProgress(){
  const cats=Object.keys(COLLECTIBLES);let all=true;
  for(const c of cats){
    const got=Object.keys(state.collected[c]).length,total=dialogue[c].length;
    if(got>=total&&!state.easterEggShown[c]){state.easterEggShown[c]=true;append('★ '+EASTER_EGGS[c],'ev');}
    if(got<total)all=false;
  }
  const totalCollected=cats.reduce((s,c)=>s+Object.keys(state.collected[c]).length,0);
  const slotsUnlocked=ARCHIVE_MILESTONES.filter(m=>totalCollected>=m).length;
  if(all&&slotsUnlocked>=9&&!state.letterUnlocked){state.letterUnlocked=true;append('★ 图鉴集齐。Boss 有封信给你。','ev');}
  paintGallery();
}
function processCommand(raw){
  const text=String(raw||'').trim().toLowerCase();if(!text)return;
  append(text,'user');
  // 被怀疑：先判断是否被说服
  if(state.suspicious){
    if(/(朋友|粉丝|认识|告诉|同学|同事|偶遇|听说|网上|新闻|报纸|梅婶|玛丽|内德|奈德|mj)/.test(text)){
      state.convinced=true;state.suspicious=false;append(lineFrom(['peterMood','peterFriends','peterHumor'][Math.floor(Math.random()*3)]),'ev');return;
    }
    append(lineFrom('peterShock'),'ev');return;
  }
  if(state.turtle){
    const t=state.turtle;
    if(/放弃|不玩|跳过|公布|汤底/.test(text)){append('汤底：'+t.answer,'ev');state.turtle=null;return;}
    if(/答案|因为|真相|所以/.test(text)){
      const guess=text.replace(/[答案汤底是是因为真相所以，。！？\s]/g,'');
      if(t.yes.some(k=>guess.includes(k))){append('猜对了！'+t.answer,'ev');state.turtle=null;}
      else append('不对。再想想。','ev');
      return;
    }
    if(t.yes.some(k=>text.includes(k)))append('是。','ev');
    else append('不是，或者不重要。','ev');
    return;
  }
  if(/彼得|帕克|小彼|皮特|peter/.test(text)){
    if(state.convinced){append(lineFrom(['peterMood','peterFriends','peterHumor'][Math.floor(Math.random()*3)]),'ev');return;}
    state.suspicious=true;append(lineFrom('peterShock'),'ev');return;
  }
  if(/蜘蛛侠|蜘蛛人|小虫|spidey|spider.?man|boss/.test(text)){append(lineFrom('peterDaily'),'ev');return;}
  if(/几点|时间|现在几点/.test(text)){append(lineFrom('time',{time:new Intl.DateTimeFormat('zh-CN',{hour:'2-digit',minute:'2-digit'}).format(new Date())}),'ev');return;}
  if(/你好|嗨|在吗/.test(text)){append(lineFrom('greet'),'ev');return;}
  if(/你在吗|状态|干嘛/.test(text)){append(lineFrom('status'),'ev');return;}
  if(/可爱|好萌|漂亮|好看|喜欢你|爱你|厉害|聪明|真棒|烦死|讨厌/.test(text)){append(lineFrom('praise'),'ev');return;}
  if(/你是什么|你会什么|能干嘛|你能做什么|你有感情|你喜欢什么|你怕什么/.test(text)){append(lineFrom('about'),'ev');return;}
  if(/天气|下雨|晴天|冷|热|温度|季节|无聊|不知道聊什么/.test(text)){append(lineFrom('smalltalk'),'ev');return;}
  if(/累|疲惫|好困|困了|心情|难过|伤心|焦虑|压力|不开心|郁闷|好烦/.test(text)){append(lineFrom('mood'),'ev');return;}
  if(/海龟汤|海龟谜/.test(text)){state.turtle=TURTLE_SOUP[Math.floor(Math.random()*TURTLE_SOUP.length)];append('海龟汤：'+state.turtle.face+'（用"是/否"提问，或说"答案是…"）','ev');return;}
  if(/打猎/.test(text)){const g=EV_GIFTS[Math.floor(Math.random()*EV_GIFTS.length)];if(!state.gifts.some(x=>x.title===g.title))state.gifts.push(g);append('打猎回来：'+g.title+'。'+g.ev,'ev');paintGallery();return;}
  append(lineFrom('unknown'),'ev');
}

// ===== UI =====
const logEl=document.getElementById('log'),galEl=document.getElementById('gallery');
let letterBurned=false,burning=false,forwardShown=false;
function append(t,who){const d=document.createElement('div');d.className='msg '+(who==='user'?'user':'');d.textContent=t;logEl.append(d);logEl.scrollTop=logEl.scrollHeight;}
function paintGallery(){
  const all=[];
  for(const key of Object.keys(COLLECTIBLES)){
    const pool=dialogue[key];
    const idxs=Object.keys(state.collected[key]).map(Number).sort((a,b)=>a-b);
    for(const i of idxs)all.push(pool[i]);
  }
  const total=all.length;
  const slotsUnlocked=ARCHIVE_MILESTONES.filter(m=>total>=m).length;
  let html='<div class="archive-grid">';
  for(let i=0;i<9;i++){
    const a=ARCHIVE[i];
    if(i<slotsUnlocked)html+=`<button class="archive-slot unlocked" data-idx="${i}">${a.title}</button>`;
    else html+=`<button class="archive-slot locked" disabled>🔒 DATA ENCRYPTED</button>`;
  }
  html+='</div><div class="archive-slips">';
  for(const t of all)html+=`<div class="slip">${t}</div>`;
  for(let i=0;i<Math.floor(total/8);i++)html+=`<div class="slip tease">💬 ${TEASES[i]}</div>`;
  html+='</div>';
  html+=`<div class="archive-progress">ARCHIVE PROGRESS: ${slotsUnlocked}/9</div>`;
  if(state.gifts.length){
    html+='<div class="g-cat">EV 的礼物</div><div class="archive-grid">';
    state.gifts.forEach((g,gi)=>html+=`<button class="archive-slot unlocked gift" data-gift="${gi}">🎁 ${g.title}</button>`);
    html+='</div>';
  }
  galEl.innerHTML=html;
  galEl.querySelectorAll('.archive-slot.unlocked').forEach(b=>b.addEventListener('click',()=>openArchive(Number(b.dataset.idx))));
  galEl.querySelectorAll('.archive-slot.gift').forEach(b=>b.addEventListener('click',()=>{
    const g=state.gifts[Number(b.dataset.gift)];if(!g)return;
    document.getElementById('archive-detail-title').textContent=g.title;
    document.getElementById('archive-detail-note').textContent=g.note;
    document.getElementById('archive-detail-ev').textContent='E.V.：'+g.ev;
    document.getElementById('archive-detail').hidden=false;
  }));
  document.getElementById('letter-envelope').hidden=!(state.letterUnlocked&&!letterBurned);
}
function openArchive(idx){
  const a=ARCHIVE[idx];if(!a)return;
  document.getElementById('archive-detail-title').textContent=a.title;
  document.getElementById('archive-detail-note').textContent=a.note;
  document.getElementById('archive-detail-ev').textContent='E.V.：'+a.ev;
  document.getElementById('archive-detail').hidden=false;
}
document.getElementById('archive-detail-close').addEventListener('click',()=>{document.getElementById('archive-detail').hidden=true;});
document.getElementById('send').addEventListener('click',()=>{processCommand(document.getElementById('msg').value);document.getElementById('msg').value='';});
document.getElementById('msg').addEventListener('keydown',e=>{if(e.key==='Enter'){processCommand(e.target.value);e.target.value='';}});
document.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>processCommand(b.dataset.q)));
document.getElementById('fillall').addEventListener('click',()=>{
  for(const key of Object.keys(COLLECTIBLES))for(let i=0;i<dialogue[key].length;i++)state.collected[key][i]=true;
  for(const key of Object.keys(COLLECTIBLES))state.easterEggShown[key]=true;
  state.letterUnlocked=true;collectProgress();
});
document.getElementById('letter-open').addEventListener('click',()=>{
  window.letterBurn.render(document.getElementById('letter-canvas'), PETER_LETTER);
  document.getElementById('letter-read').hidden=false;
  document.getElementById('letter-modal').hidden=false;
});
function showForwardLook(){
  if(forwardShown)return;forwardShown=true;
  window.letterBurn.forwardLook(document.getElementById('forward-canvas'));
}
document.getElementById('letter-read').addEventListener('click',()=>{
  document.getElementById('letter-read').hidden=true;
  burning=true;
  window.letterBurn.burn(document.getElementById('letter-canvas'), ()=>{
    burning=false;
    letterBurned=true;
    document.getElementById('letter-modal').hidden=true;
    document.getElementById('letter-envelope').hidden=true;
    document.getElementById('brand-new-day').hidden=false;
  });
});
document.getElementById('letter-modal').addEventListener('pointerdown',()=>{if(burning)showForwardLook();});
function paintExtras(){
  document.getElementById('skins').innerHTML='<div class="g-cat">皮肤预览（一起玩配色）</div>'+Object.entries(SKINS).map(([k,s])=>`<div class="card"><span style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${s.glow};margin-right:8px"></span>${s.name} · 身体 ${s.body} · 光 ${s.glow}</div>`).join('');
  document.getElementById('times').innerHTML='<div class="g-cat">时间感知台词</div>'+Object.entries(TIME_LINES).map(([k,lines])=>`<div class="card"><b>${k}</b>：${lines.join(' / ')}</div>`).join('');
}
paintExtras();
paintGallery();
</script>
</body>
</html>
